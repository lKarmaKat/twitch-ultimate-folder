    M8 58
    Q8 46 22 46
    L106 46
    Q120 46 120 58
    L120 62
    Q120 50 106 50
    L22 50
    Q10 50 8 62 Z
  " fill="#B06AFF" opacity="0.5"/>

  <!-- === TWITCH LOGO on the front flap === -->
  <g transform="translate(33, 56)">
    <!-- White speech bubble -->
    <rect x="0" y="0" width="62" height="48" rx="6" fill="white"/>
    <!-- Chat tail bottom-left -->
    <polygon points="0,48 0,62 15,48" fill="white"/>
    <!-- Left bar -->
    <rect x="12" y="10" width="12" height="23" rx="2.5" fill="#9147FF"/>
    <!-- Right bar -->
    <rect x="38" y="10" width="12" height="23" rx="2.5" fill="#9147FF"/>
  </g>

</svg>