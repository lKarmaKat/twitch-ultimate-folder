<html>

<head>
  <title>Water Popup</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup_style.css">
  <style>
    /* LOADER */
    .loading-wrapper {
      width: 100%;
      max-width: 100%;
      height: 100%;
      max-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loading-overlay {
      width: 120px;
      padding: 16px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #a970ff;
      --_m:
        conic-gradient(#0000 10%, #000),
        linear-gradient(#000 0 0) content-box;
      -webkit-mask: var(--_m);
      mask: var(--_m);
      -webkit-mask-composite: source-out;
      mask-composite: subtract;
      animation: l3 1s infinite linear;
    }

    @keyframes l3 {
      to {
        transform: rotate(1turn)
      }
    }

    /* AUTH CONTAINER */
     .auth-flex {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px 12px;
        gap: 8px;
        text-align: center;
    }

    .auth-icon {
        flex-shrink: 0;
    }

    .auth-title {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
    }

    .auth-instruction {
        margin: 0;
        font-size: 12px;
        opacity: 0.85;
    }

    .auth-code {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-decoration: none;
        cursor: pointer;
    }

    .auth-waiting {
        margin: 0;
        font-size: 11px;
        opacity: 0.6;
    }

    .auth-flex p,
    .auth-flex strong {
        color: black;
    }
    .auth-icon {
        fill: #7b3fc9;
    }
    .auth-code {
        background: #f0e6ff;
        color: #7b3fc9;
        border: 1px solid #7b3fc9;
    }




  </style>
</head>

<body>
  <!--  <input type="checkbox" name="theme" id="theme"><label for="theme">Theme sombre ?</label> -->
  <div class="loader">
    <div class="loading-wrapper">
      <div class="loading-overlay"></div>
    </div>
  </div>
  <div class="auth-container" hidden>
    <div class="auth-flex">
      <svg width="32px" height="32px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="auth-icon">
        <path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.25C17.25 21.15 21 16.25 21 11V5L12 1z" />
      </svg>
      <p class="auth-title">Connexion Twitch requise</p>
      <p class="auth-instruction">Rendez-vous sur <strong>twitch.tv/activate</strong> et entrez ce code&nbsp;:</p>
      <a class="auth-code" href="" target="_blank" rel="noopener noreferrer"></a>
      <p class="auth-waiting">En attente de l'autorisation…</p>
    </div>
  </div>
  <div class="config-container" hidden>
    <div class="popup">
      <div class="card">
        <div class="card-header">
          <h1>Préférences</h1>
        </div>

        <div class="row">
          <div class="row-info">
            <button id="btn" class="btn btn-primary" value="0.1">Open config popup</button>
          </div>
        </div>

        <label class="row" for="theme">
          <div class="row-info">
            <div class="row-label">Thème</div>
            <!-- <div class="row-sub">Apparence de l'interface</div> -->
          </div>
          <input type="checkbox" class="tgl" id="theme">
          <span class="sw">
            <span class="track"></span>
            <span class="lbl-on">Dark</span>
            <span class="lbl-off">Light</span>
            <span class="thumb"></span>
          </span>
        </label>

        <label class="row" for="alignment">
          <div class="row-info">
            <div class="row-label">Alignement des chaines</div>
            <div class="row-sub">Si vous utilisez BTTV pour changer la disposition du chat</div>
          </div>
          <input type="checkbox" class="tgl" id="alignment" checked>
          <span class="sw">
            <span class="track"></span>
            <span class="lbl-on">Droite</span>
            <span class="lbl-off">Gauche</span>
            <span class="thumb"></span>
          </span>
        </label>

      <label class="row" for="sync">

        </div>
        <input type="checkbox" class="tgl blue" id="sync">
        <span class="sw">
          <span class="track"></span>
          <span class="lbl-on">On</span>
          <span class="lbl-off">Off</span>
          <span class="thumb"></span>
        </span>
      </label>

      <label class="row" for="loc">
        <div class="row-info">
          <div class="row-label">Localisation</div>
          <div class="row-sub">Accès à votre position</div>
        </div>
        <input type="checkbox" class="tgl orange" id="loc" checked>
        <span class="sw">
          <span class="track"></span>
          <span class="lbl-on">On</span>
          <span class="lbl-off">Off</span>
          <span class="thumb"></span>
        </span>
      </label> -->

    </div>
  </div>
  <script type="module" src="./popup.js"></script>

</body>
