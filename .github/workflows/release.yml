name: Release

# Déclenchement manuel depuis l'onglet Actions : on choisit le niveau de bump,
# le workflow s'occupe du tag, des deux builds et de la release GitHub.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Niveau de bump semver'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # couvre le push du commit/tag et la création de la release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    # Garde-fou : on ne publie pas depuis une branche de feature.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Bump version, commit & tag
        id: bump
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TAG=$(npm version "${{ inputs.bump }}" -m 'chore(release): v%s')
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Pas de [skip ci] necessaire : un push signe par GITHUB_TOKEN
          # ne redeclenche aucun workflow.
          git push --follow-tags

      # package.json est deja bumpe : vite.config.ts y lit la version
      # qu'il injecte dans les deux manifests.
      - name: Build chrome + firefox
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          npm run build:chrome
          npm run build:firefox
          (cd dist/chrome  && zip -qr "../../twitch-ultimate-folder-chrome-$VERSION.zip" .)
          (cd dist/firefox && zip -qr "../../twitch-ultimate-folder-firefox-$VERSION.zip" .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            twitch-ultimate-folder-*.zip

      # Filet de securite : si le build ou la release casse apres le push du tag,
      # les zips restent recuperables pour publier a la main.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-zips
          path: twitch-ultimate-folder-*.zip
          if-no-files-found: ignore
          retention-days: 14
